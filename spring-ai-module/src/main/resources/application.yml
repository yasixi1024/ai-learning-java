spring:
  application:
    name: spring-ai-module
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        completions-path: ${OPENAI_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: gpt-4o-mini
          temperature: 0.7

server:
  port: 8080
